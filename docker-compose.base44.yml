services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    environment:
      - BASE44_PREVIEW_MODE=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    working_dir: /workspace
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://localhost:5173/ | grep -q 'Sakura'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  api:
    image: node:22-slim
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["node", "server/index.mjs"]
    env_file:
      - /run/base44/app.env
    environment:
      - BASE44_PREVIEW_MODE=1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

volumes:
  node_modules:
