<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Japanese Life — Character Studio</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header id="topbar">
      <div class="logo">🌸 Sakura Japanese Life</div>
      <div class="subtitle">Character Studio</div>
      <div class="spacer"></div>
      <button id="btn-skeleton" class="btn-toggle active">🦴 Скелет</button>
      <button id="btn-grid" class="btn-toggle active">📐 Сетка</button>
      <button id="btn-wireframe" class="btn-toggle">🔲 Каркас</button>
      <button id="btn-ref" class="btn-toggle">🖼 Референс</button>
    </header>

    <div id="main-layout">
      <!-- Left panel: Structure + Bones -->
      <aside id="left-panel" class="panel">
        <div class="panel-section">
          <h3>📦 Структура модели</h3>
          <div id="structure-tree"></div>
        </div>
        <div class="panel-section">
          <h3>🦴 Иерархия костей</h3>
          <div id="bone-tree"></div>
        </div>
      </aside>

      <!-- Center: 3D viewport -->
      <main id="viewport">
        <div id="loading">
          <div class="spinner"></div>
          <div id="loading-text">Загрузка модели…</div>
        </div>
        <canvas id="three-canvas"></canvas>
        <div id="ref-overlay">
          <img id="ref-img" src="/reference.png" />
        </div>
        <div id="viewport-info">
          <b>ЛКМ</b> — вращать · <b>Колесо</b> — зум · <b>ПКМ</b> — перемещать
        </div>
      </main>

      <!-- Right panel: Chat + Code editor + Controls -->
      <aside id="right-panel" class="panel">
        <div class="panel-section chat-section">
          <h3>💬 Чат с GPT</h3>
          <div id="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Опиши анимацию…" autocomplete="off" />
            <button id="chat-send" class="btn-primary">➤</button>
          </div>
        </div>
        <div class="panel-section flex-grow">
          <h3>💻 Анимация кодом</h3>
          <div class="code-toolbar">
            <select id="preset-select">
              <option value="">— Пресет —</option>
              <option value="idle">Idle (дыхание)</option>
              <option value="walk">Walk (ходьба)</option>
              <option value="wave">Wave (приветствие)</option>
              <option value="bow">Bow (поклон)</option>
              <option value="dance">Dance (танец)</option>
            </select>
            <button id="btn-run" class="btn-primary">▶ Запустить</button>
            <button id="btn-stop" class="btn-secondary">⏹ Стоп</button>
          </div>
          <textarea id="code-editor" spellcheck="false"></textarea>
        </div>
        <div class="panel-section">
          <h3>🎛 Управление</h3>
          <div class="control-row">
            <label>Скорость</label>
            <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1" />
            <span id="speed-value">1.0×</span>
          </div>
          <div class="control-row">
            <button id="btn-reset-pose" class="btn-secondary">🔄 Сброс позы</button>
            <button id="btn-export" class="btn-secondary">💾 Экспорт GLB</button>
          </div>
        </div>
        <div class="panel-section">
          <h3>📊 Инфо</h3>
          <div id="model-info"></div>
        </div>
      </aside>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
