<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Model Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #app { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; }

    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #e0e0e0; font-family: system-ui, sans-serif; font-size: 18px;
      text-align: center;
    }
    #loading .spinner {
      width: 40px; height: 40px; border: 3px solid #444; border-top-color: #7b68ee;
      border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #info {
      position: absolute; top: 16px; left: 16px;
      color: #ccc; font-family: system-ui, sans-serif; font-size: 13px;
      background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 8px;
      pointer-events: none; line-height: 1.6;
    }
    #info b { color: #fff; }

    #ref-toggle {
      position: absolute; top: 16px; right: 16px;
      background: rgba(123,104,238,0.85); color: #fff; border: none;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      font-family: system-ui, sans-serif; font-size: 14px;
    }
    #ref-toggle:hover { background: rgba(123,104,238,1); }

    #ref-panel {
      position: absolute; top: 56px; right: 16px;
      max-width: 320px; max-height: 60vh; overflow: hidden;
      border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: none;
    }
    #ref-panel img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      Загрузка модели…
    </div>
    <div id="info" style="display:none">
      <b>GLB Model Viewer</b><br>
      ЛКМ — вращать · Колесо — зум<br>
      ПКМ — перемещать
    </div>
    <button id="ref-toggle" style="display:none">Референс</button>
    <div id="ref-panel"><img id="ref-img" /></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
